name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/backend-ci.yml"

jobs:
  build-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Сборка бэкенда (эквивалент `docker compose build backend`: контекст ./backend).
      # Слои кэшируются в GitHub Actions Cache (type=gha): apt-зависимости и
      # объектники CMake не пересобираются, пока не меняются Dockerfile/исходники.
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: homenvr-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
        # exit code != 0 -> шаг и весь пайплайн падают автоматически

services:
  nginx:
    image: nginx:alpine
    container_name: homenvr-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./data/recordings:/data/recordings:ro
      - ./data/exports:/data/exports:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: homenvr-frontend
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: homenvr-backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      RECORDINGS_PATH: /data/recordings
      THUMBNAILS_PATH: /data/thumbnails
      EXPORTS_PATH: /data/exports
      LIVE_PATH: /data/live
      HLS_PATH: /data/hls
      SECRET_KEY_FILE: /run/secrets/secret_key
    volumes:
      - ./data/recordings:/data/recordings
      - ./data/thumbnails:/data/thumbnails
      - ./data/exports:/data/exports
      - ./data/live:/data/live
      - ./data/hls:/data/hls
    secrets:
      - secret_key
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: homenvr-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

secrets:
  secret_key:
    file: ./data/config/secret_key

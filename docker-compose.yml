x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  nginx:
    image: nginx:alpine
    container_name: homenvr-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./data/recordings:/data/recordings:ro
      - ./data/exports:/data/exports:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      autoheal: "true"
    logging: *default-logging
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: homenvr-frontend
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      autoheal: "true"
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 350m

  backend:
    build: ./backend
    container_name: homenvr-backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      RECORDINGS_PATH: /data/recordings
      THUMBNAILS_PATH: /data/thumbnails
      EXPORTS_PATH: /data/exports
      LIVE_PATH: /data/live
      HLS_PATH: /data/hls
      LOGS_PATH: /data/logs
      SECRET_KEY_FILE: /run/secrets/secret_key
    volumes:
      - ./data/recordings:/data/recordings
      - ./data/thumbnails:/data/thumbnails
      - ./data/exports:/data/exports
      - ./data/live:/data/live
      - ./data/hls:/data/hls
      - ./data/logs:/data/logs
    secrets:
      - secret_key
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      # VM под нагрузкой загрузки: даём backend время прогреться,
      # иначе autoheal рестартит здоровый контейнер по ложному unhealthy
      start_period: 90s
    labels:
      autoheal: "true"
    logging: *default-logging
    restart: unless-stopped
    # лимиты памяти: VM с 2 ГБ — разбушевавшийся процесс не должен
    # уронить всю виртуалку (OOM-kill контейнера + restart лучше фриза VM)
    mem_limit: 900m
    mem_reservation: 256m

  postgres:
    image: postgres:16-alpine
    container_name: homenvr-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      autoheal: "true"
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 400m

  # Recovery (ТЗ §55, Phase 7): перезапускает контейнеры, ставшие unhealthy
  # (например, при дедлоке/зависании backend — healthcheck падает, autoheal решает)
  autoheal:
    image: willfarrell/autoheal
    container_name: homenvr-autoheal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: "30"
    logging: *default-logging
    restart: unless-stopped

secrets:
  secret_key:
    file: ./data/config/secret_key

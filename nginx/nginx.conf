user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # WebSocket upgrade только когда клиент реально просит upgrade —
    # иначе Connection: close (корректный proxying обычных запросов)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # --- Безопасность (ТЗ §67) ---
    server_tokens off;  # не палим версию nginx

    # Тело запроса: API-запросы — маленькие JSON; большие тела не нужны нигде
    # (M4 аудита: без лимита 100 МБ POST в /api аллоцировались в памяти
    # backend'а → OOM при mem_limit 900m)
    proxy_request_buffering off;
    client_max_body_size 1m;

    upstream frontend {
        server frontend:3000;
    }

    upstream backend {
        server backend:8080;
    }

    server {
        listen 80;
        server_name _;

        # Security headers — применяются ко всем ответам
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy no-referrer always;
        # Примечание: script-src 'unsafe-inline' необходим для Next.js App Router
        # (inline-скрипты гидратации). Остальные директивы остаются строгими.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self' ws: wss:; frame-ancestors 'self'" always;

        # Frontend (Next.js)
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # Health check backend'а (мониторинг, ТЗ §59)
        location = /health {
            proxy_pass http://backend;
            proxy_http_version 1.1;
        }

        # REST API -> C++ backend
        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 300s;  # export может быть долгим
        }

        # WebSocket -> C++ backend
        location /ws {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;  # долгоживущее соединение
        }

        # HLS live-поток и архив -> backend (Range requests для видео)
        location /stream/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_cache off;
            add_header Cache-Control no-cache always;
        }

        # Внутренняя отдача export-файлов (X-Accel-Redirect от backend).
        # Backend проверяет авторизацию, nginx отдаёт файл с Range support (ТЗ §15).
        location /internal/exports/ {
            internal;
            alias /data/exports/;
        }
    }
}
